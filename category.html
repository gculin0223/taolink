<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>カテゴリ商品 | China Door</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="market-page">
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="./index.html" aria-label="China Door home">
          <span class="brand-mark">門</span>
          <span>
            <strong>China Door</strong>
            <small>中国買付・国際配送</small>
          </span>
        </a>
        <div class="nav-links" aria-label="Main navigation">
          <a href="./index.html#categories">カテゴリ</a>
          <a href="./index.html#shops">ショップ</a>
          <a href="./index.html#guide">ご利用ガイド</a>
        </div>
        <a class="cart-button market-back" href="./index.html">
          <span>戻る</span>
        </a>
      </nav>
    </header>

    <main class="market-shell">
      <section class="market-heading">
        <div>
          <a class="breadcrumb" href="./index.html#categories">← カテゴリ一覧</a>
          <p class="eyebrow">China marketplace</p>
          <h1 data-category-title>カテゴリ商品</h1>
          <p data-category-copy>
            中国のショップ・個人セラーの商品を、日本語で確認して買付相談できます。
          </p>
        </div>
        <form class="market-search" role="search">
          <input type="search" placeholder="このカテゴリ内で検索" data-market-search />
          <button type="submit">検索</button>
        </form>
      </section>

      <section class="seller-tabs" aria-label="Seller filters">
        <button class="is-active" type="button" data-seller-filter="all">すべて</button>
        <button type="button" data-seller-filter="personal">個人セラー</button>
        <button type="button" data-seller-filter="verified">認証ショップ</button>
        <button type="button" data-seller-filter="factory">工場・卸</button>
      </section>

      <section class="market-layout">
        <aside class="market-sidebar" aria-label="Category navigation">
          <h2>カテゴリ</h2>
          <div data-market-categories></div>
          <div class="fee-box">
            <h3>表示価格について</h3>
            <p>商品価格は中国元の原価を先に表示し、後ろに日本円の参考換算を併記します。買付前に在庫・国内送料・国際発送可否を確認します。</p>
          </div>
        </aside>

        <section class="market-list-area">
          <div class="market-toolbar">
            <p data-market-count></p>
            <select data-sort>
              <option value="recommended">おすすめ順</option>
              <option value="low">価格が安い順</option>
              <option value="high">価格が高い順</option>
            </select>
          </div>
          <div class="market-list" data-market-list></div>
        </section>
      </section>
    </main>

    <script src="./category.js"></script>
  </body>
</html>
