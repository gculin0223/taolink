<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ショップ詳細 | タオリンク</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="market-page">
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="./index.html" aria-label="タオリンク home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 42 42" focusable="false">
              <rect width="42" height="42" rx="13" fill="#ffe8ef" />
              <path d="M11 36V16c0-7 5-12 10-12s10 5 10 12v20" fill="#e95d8f" />
              <path d="M15 36V18c0-4 3-7 6-7s6 3 6 7v18" fill="#fff7ec" />
              <path d="M15 22h12" stroke="#d94a3f" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="25" cy="27" r="1.8" fill="#e3aa43" />
            </svg>
          </span>
          <span>
            <strong>タオリンク</strong>
            <small>中国買付・国際配送</small>
          </span>
        </a>
        <div class="nav-links" aria-label="Main navigation">
          <a href="./index.html#categories">カテゴリ</a>
          <a href="./index.html#shops">ショップ</a>
          <a href="./index.html#guide">ご利用ガイド</a>
        </div>
        <a class="cart-button market-back" href="./index.html#shops">
          <span>戻る</span>
        </a>
      </nav>
    </header>

    <main class="market-shell">
      <a class="breadcrumb" href="./index.html#shops">← ショップ一覧</a>
      <section class="shop-hero" data-shop-hero></section>

      <section class="market-list-area">
        <div class="market-toolbar">
          <p data-shop-count></p>
          <select data-shop-sort>
            <option value="recommended">おすすめ順</option>
            <option value="low">価格が安い順</option>
            <option value="high">価格が高い順</option>
          </select>
        </div>
        <div class="market-list" data-shop-products></div>
      </section>
    </main>

    <script src="./shop.js"></script>
  </body>
</html>
